    <!-- Cropper.js JS para el recortador de imagen -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>

    <script>
        let cropper = null;

        // Sobrescribe o intercepta previewImagen
        function previewImagen(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const cropperImage = document.getElementById('cropperImage');
                    cropperImage.src = e.target.result;
                    
                    document.getElementById('modalCrop').style.display = 'flex';
                    
                    if (cropper) {
                        cropper.destroy();
                    }
                    
                    cropper = new Cropper(cropperImage, {
                        aspectRatio: 1, // Cuadrado perfecto (1:1) para la foto de perfil circular
                        viewMode: 1,
                        autoCropArea: 0.8,
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function aplicarRecorte() {
            if (cropper) {
                const canvas = cropper.getCroppedCanvas({
                    width: 300,
                    height: 300
                });
                
                const croppedImageDataURL = canvas.toDataURL('image/jpeg');
                
                // Actualiza la previa en el modal de configuración de perfil
                const previewPerfil = document.getElementById('previewPerfil');
                if (previewPerfil) {
                    previewPerfil.src = croppedImageDataURL;
                }

                cancelarRecorte();
            }
        }

        function cancelarRecorte() {
            document.getElementById('modalCrop').style.display = 'none';
            if (cropper) {
                cropper.destroy();
                cropper = null;
            }
            document.getElementById('editAvatar').value = "";
        }
    </script>
